<script>
'use strict';
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const BGM_FILES = ['bgm.mp3'];
const STAKE = 50, WIN_COINS = 100, POOL = STAKE * 2, BONUS = 500, MAX_HINTS = 4, MAX_UNDOS = 4;
const LEVELS = [
  { id: 'easy',        name: 'Easy',        icon: '🌱', depth: 2,  ms: 0,    rand: 0.25, desc: 'Looks 2 moves ahead, sometimes slips' },
  { id: 'medium',      name: 'Medium',      icon: '⚡', depth: 4,  ms: 0,    rand: 0,    desc: 'Looks 4 moves ahead' },
  { id: 'hard',        name: 'Hard',        icon: '🔥', depth: 6,  ms: 1500, rand: 0,    desc: 'Looks up to 6 moves ahead' },
  { id: 'expert',      name: 'Expert',      icon: '💎', depth: 9,  ms: 2500, rand: 0,    desc: 'Looks up to 9 moves ahead' },
  { id: 'grandmaster', name: 'Grandmaster', icon: '👑', depth: 14, ms: 3500, rand: 0,    desc: 'Searches up to 14 moves ahead' }
];
const UNLOCK_NEED = [0, 3, 3, 3, 7];
const PEER_SRC = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
const ROOM_PREFIX = 'connect4-hns-';
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

let save = { coins: 0, first: true, wins: {}, music: true, sfx: true, youFirst: true };
try {
  const s = JSON.parse(localStorage.getItem('c4hns'));
  if (s && typeof s === 'object') save = Object.assign(save, s);
} catch (e) {}
save.coins = Math.max(0, Math.floor(Number(save.coins) || 0));
if (!save.wins || typeof save.wins !== 'object') save.wins = {};
function persist() { try { localStorage.setItem('c4hns', JSON.stringify(save)); } catch (e) {} }

let actx = null;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, dur, type, vol, when, slide) {
  if (!save.sfx) return;
  const a = ac(); if (!a) return;
  const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .03);
}
const sfx = {
  drop() { tone(320, .13, 'triangle', .22, 0, 110); },
  click() { tone(520, .05, 'square', .04); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .24, 'triangle', .18, i * .12)); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, .3, 'sawtooth', .07, i * .16)); },
  coin() { tone(988, .08, 'square', .05); tone(1319, .2, 'square', .05, .08); },
  err() { tone(160, .15, 'square', .07); }
};
let bgm = null, bgmIdx = 0;
function initMusic() {
  if (!BGM_FILES.length) { $('btnMusic').classList.add('hidden'); return; }
  bgm = new Audio(BGM_FILES[0]); bgm.volume = .35; bgm.loop = BGM_FILES.length === 1;
  bgm.addEventListener('ended', () => {
    bgmIdx = (bgmIdx + 1) % BGM_FILES.length;
    bgm.src = BGM_FILES[bgmIdx];
    bgm.play().catch(() => {});
  });
  bgm.addEventListener('error', () => { $('btnMusic').classList.add('hidden'); bgm = null; });
}
function syncAudioButtons() {
  $('btnMusic').classList.toggle('off', !save.music);
  $('btnMusic').textContent = save.music ? '🎵' : '🔇';
  $('btnSfx').classList.toggle('off', !save.sfx);
  if (bgm) { if (save.music) bgm.play().catch(() => {}); else bgm.pause(); }
}

let toastT = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function renderCoins(bump) {
  $('coinN').textContent = save.coins.toLocaleString();
  if (bump && !reduced) {
    const c = $('coinChip');
    c.classList.remove('bump');
    void c.offsetWidth;
    c.classList.add('bump');
  }
}
function floatText(n) {
  const s = document.createElement('span');
  s.className = 'float';
  s.textContent = (n > 0 ? '+' : '') + n;
  $('coinChip').appendChild(s);
  setTimeout(() => s.remove(), 1300);
}
function addCoins(n) {
  save.coins = Math.max(0, save.coins + n);
  persist();
  renderCoins(true);
  if (n) floatText(n);
}
function grantBonusIfNeeded() {
  if (save.first) {
    save.first = false;
    save.coins += BONUS;
    persist();
    toast('🎁 Welcome bonus: +500 coins!');
    sfx.coin();
    renderCoins(true);
  } else if (save.coins < STAKE) {
    save.coins += BONUS;
    persist();
    toast('🎁 Low on coins - bonus +500!');
    sfx.coin();
    renderCoins(true);
  }
}
function confetti() {
  if (reduced) return;
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth;
  cv.height = innerHeight;
  const cols = ['#ff4d6d', '#ffd23f', '#4dabf7', '#69db7c', '#da77f2'];
  const P = Array.from({ length: 140 }, () => ({
    x: Math.random() * cv.width,
    y: -20 - Math.random() * cv.height * .5,
    vx: (Math.random() - .5) * 3,
    vy: 2 + Math.random() * 4,
    s: 5 + Math.random() * 7,
    c: cols[(Math.random() * 5) | 0],
    r: Math.random() * 6,
    vr: (Math.random() - .5) * .3
  }));
  const t0 = performance.now();
  (function f(ts) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
      ctx.restore();
    }
    if (ts - t0 < 3200) requestAnimationFrame(f);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}
(function bgDiscs() {
  let h = '';
  for (let i = 0; i < 14; i++) {
    const s = 24 + Math.random() * 50;
    h += `<i class="${i % 2 ? 'r' : 'y'}" style="width:${s}px;height:${s}px;left:${Math.random() * 100}%;animation-duration:${14 + Math.random() * 18}s;animation-delay:${-Math.random() * 25}s"></i>`;
  }
  $('bg').innerHTML = h;
})();

const ai = (() => {
  const src = $('ai-src').textContent;
  let worker = null, seq = 0, fallback = null;
  const pending = new Map();
  function getFallback() {
    if (!fallback) fallback = new Function(src + '\nreturn solve;')();
    return fallback;
  }
  try {
    const glue = '\nself.onmessage=function(e){var d=e.data;var r=solve(d.board,d.heights,d.moves,d.me,d.depth,d.ms);r.id=d.id;self.postMessage(r);};';
    worker = new Worker(URL.createObjectURL(new Blob([src + glue], { type: 'text/javascript' })));
    worker.onmessage = e => {
      const p = pending.get(e.data.id);
      if (p) { pending.delete(e.data.id); p.resolve(e.data); }
    };
    worker.onerror = () => {
      worker = null;
      for (const [id, p] of pending) {
        pending.delete(id);
        const d = p.args;
        p.resolve(getFallback()(d.board, d.heights, d.moves, d.me, d.depth, d.ms));
      }
    };
  } catch (e) { worker = null; }
  return {
    think(a) {
      return new Promise(resolve => {
        if (worker) {
          const id = ++seq;
          pending.set(id, { resolve, args: a });
          worker.postMessage(Object.assign({ id }, a));
        } else {
          setTimeout(() => resolve(getFallback()(a.board, a.heights, a.moves, a.me, a.depth, a.ms)), 20);
        }
      });
    }
  };
})();

const S = {
  mode: null, level: null, board: new Int8Array(42), heights: new Int8Array(7), hist: [],
  over: true, active: false, busy: false, winCells: [], hintCol: -1,
  hints: MAX_HINTS, undos: MAX_UNDOS, hintBusy: false, myP: 1, animCell: -1, aiToken: 0
};
const turn = () => 1 + (S.hist.length & 1);

function resetBoard() {
  S.board = new Int8Array(42); S.heights = new Int8Array(7); S.hist = [];
  S.over = false; S.busy = false; S.winCells = []; S.hintCol = -1;
  S.animCell = -1; S.hintBusy = false; S.aiToken++;
}
function place(col) {
  const p = turn(), r = S.heights[col], cell = col * 6 + r;
  S.board[cell] = p; S.heights[col]++; S.hist.push(col); S.animCell = cell;
  const line = findLine(cell, p);
  if (line) return { state: 'win', cells: line };
  if (S.hist.length === 42) return { state: 'draw', cells: [] };
  return { state: 'ok', cells: [] };
}
function findLine(cell, p) {
  const c0 = (cell / 6) | 0, r0 = cell % 6;
  for (const [dc, dr] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
    const cells = [cell];
    for (const s of [1, -1]) {
      let c = c0 + s * dc, r = r0 + s * dr;
      while (c >= 0 && c < 7 && r >= 0 && r < 6 && S.board[c * 6 + r] === p) {
        cells.push(c * 6 + r); c += s * dc; r += s * dr;
      }
    }
    if (cells.length >= 4) return cells;
  }
  return null;
}
function replay(hist) {
  S.board = new Int8Array(42); S.heights = new Int8Array(7); S.hist = [];
  for (const c of hist) {
    const p = 1 + (S.hist.length & 1);
    S.board[c * 6 + S.heights[c]] = p; S.heights[c]++; S.hist.push(c);
  }
}

function render() {
  const live = S.active && !S.over && !S.busy && turn() === S.myP;
  let h = '';
  for (let c = 0; c < 7; c++) {
    const can = live && S.heights[c] < 6;
    h += `<div class="col${can ? ' can' : ''}" data-c="${c}" aria-label="Drop in column ${c + 1}">`;
    for (let r = 5; r >= 0; r--) {
      const cell = c * 6 + r, v = S.board[cell];
      let cls = 'cell', inner = '';
      if (S.winCells.includes(cell)) cls += ' win';
      if (v) inner = `<div class="disc p${v}${cell === S.animCell ? ' drop' : ''}" style="--d:${6 - r}"></div>`;
      else if (r === S.heights[c]) {
        inner = `<div class="ghost p${S.myP}"></div>`;
        if (S.hintCol === c) cls += ' hint';
      }
      h += `<div class="${cls}">${inner}</div>`;
    }
    h += '</div>';
  }
  $('board').innerHTML = h;
  S.animCell = -1;
}
function layoutGame() {
  const online = S.mode === 'online';
  document.querySelectorAll('.aionly').forEach(e => e.classList.toggle('hidden', online));
  $('poolChip').classList.toggle('hidden', !online);
  $('dotYou').className = 'dotc p' + S.myP;
  $('dotOpp').className = 'dotc p' + (3 - S.myP);
  $('nmYou').textContent = 'You';
  $('nmOpp').textContent = online ? 'Friend' : 'AI · ' + S.level.name;
  $('sDepth').textContent = $('sNodes').textContent = $('sTime').textContent = $('sRate').textContent = '-';
}
function updateStatus() {
  const mine = turn() === S.myP;
  $('plYou').classList.toggle('active', !S.over && mine);
  $('plOpp').classList.toggle('active', !S.over && !mine);
  if (S.over) return;
  const you = S.myP === 1 ? '🔴' : '🟡';
  $('status').textContent = mine ? `Your turn ${you}` : (S.mode === 'ai' ? 'AI is thinking…' : "Friend's turn…");
}
function updateControls() {
  const myTurn = S.active && !S.over && !S.busy && turn() === S.myP;
  $('btnUndo').textContent = `↩ Undo (${S.undos})`;
  $('btnHint').textContent = `💡 Hint (${S.hints})`;
  $('btnUndo').disabled = !(S.mode === 'ai' && myTurn && S.hist.length >= 2 && S.undos > 0);
  $('btnHint').disabled = !(S.mode === 'ai' && myTurn && S.hints > 0 && !S.hintBusy);
}

const SCREENS = ['scrMenu', 'scrLevels', 'scrFriends', 'scrGame'];
let current = 'scrMenu';
function show(id) {
  current = id;
  SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id));
  $('btnBack').classList.toggle('hidden', id === 'scrMenu');
  window.scrollTo(0, 0);
  if (id === 'scrMenu') { grantBonusIfNeeded(); renderMenu(); }
  if (id === 'scrLevels') renderLevels();
  if (id === 'scrFriends') setFriendUI('choose');
}
function renderMenu() {
  const total = LEVELS.reduce((a, L) => a + (save.wins[L.id] || 0), 0);
  const unlocked = LEVELS.filter((_, i) => isUnlocked(i)).length;
  $('menuInfo').innerHTML = `🏆 Wins vs computer: <b>${total}</b> · Levels unlocked: <b>${unlocked}/5</b><br>🪙 Win a match = <b>+100 coins</b>. Friend matches cost 50 coins each.`;
}
function goBack() {
  if (current === 'scrGame') {
    if (S.mode === 'online') {
      if (S.active && !S.over && !confirm('Leave this match? You will forfeit your 50 coin stake.')) return;
      leaveOnline(); show('scrMenu');
    } else {
      S.aiToken++; S.busy = false; S.active = false; closeModal(); show('scrLevels');
    }
  } else if (current === 'scrFriends') {
    leaveOnline(); show('scrMenu');
  } else {
    show('scrMenu');
  }
}

function isUnlocked(i) { return i === 0 || (save.wins[LEVELS[i - 1].id] || 0) >= UNLOCK_NEED[i]; }
function renderLevels() {
  document.querySelectorAll('#firstSeg button').forEach(b => b.classList.toggle('on', (b.dataset.f === '1') === !!save.youFirst));
  let h = '';
  LEVELS.forEach((L, i) => {
    const un = isUnlocked(i), w = save.wins[L.id] || 0;
    let right, sub, bar = '';
    if (un) {
      right = `Wins: ${w}`; sub = L.desc;
      if (i < 4) {
        const need = UNLOCK_NEED[i + 1], nxt = LEVELS[i + 1].name, unl = w >= need;
        bar = `<div class="bar"><i style="width:${Math.min(100, w / need * 100)}%"></i></div><div class="ds" style="margin-top:3px">${unl ? '✅ ' + nxt + ' unlocked' : `Win ${need} to unlock ${nxt} (${w}/${need})`}</div>`;
      }
    } else {
      const prev = LEVELS[i - 1], pw = save.wins[prev.id] || 0, need = UNLOCK_NEED[i];
      right = '🔒'; sub = `Win ${need} matches on ${prev.name} to unlock`;
      bar = `<div class="bar"><i style="width:${Math.min(100, pw / need * 100)}%"></i></div><div class="ds" style="margin-top:3px">${pw}/${need} wins on ${prev.name}</div>`;
    }
    h += `<div class="lvl${un ? '' : ' locked'}" data-i="${i}"><div class="ic">${un ? L.icon : '🔒'}</div><div class="tx"><div class="nm">${L.name}</div><div class="ds">${sub}</div>${bar}</div><div class="rt">${right}</div></div>`;
  });
  $('levelList').innerHTML = h;
}

function startAI(i) {
  S.mode = 'ai'; S.level = LEVELS[i]; S.myP = save.youFirst ? 1 : 2;
  newAIMatch(); show('scrGame');
}
function newAIMatch() {
  resetBoard(); S.hints = MAX_HINTS; S.undos = MAX_UNDOS; S.active = true; closeModal();
  layoutGame(); render(); updateStatus(); updateControls();
  if (turn() !== S.myP) aiTurn();
}
async function aiTurn() {
  S.busy = true; const token = ++S.aiToken; updateStatus(); updateControls(); render();
  const L = S.level, t0 = performance.now();
  let res;
  if (Math.random() < L.rand) {
    const legal = [0, 1, 2, 3, 4, 5, 6].filter(c => S.heights[c] < 6);
    res = { col: legal[(Math.random() * legal.length) | 0] };
  } else {
    res = await ai.think({ board: Array.from(S.board), heights: Array.from(S.heights), moves: S.hist.length, me: turn(), depth: L.depth, ms: L.ms });
  }
  await sleep(Math.max(0, 450 - (performance.now() - t0)));
  if (token !== S.aiToken || S.over) return;
  S.busy = false;
  if (res.nodes) {
    $('sDepth').textContent = res.depth;
    $('sNodes').textContent = res.nodes.toLocaleString();
    $('sTime').textContent = res.ms < 1000 ? res.ms.toFixed(0) + ' ms' : (res.ms / 1000).toFixed(1) + ' s';
    $('sRate').textContent = res.ms > 0 ? Math.round(res.nodes / res.ms * 1000).toLocaleString() : '-';
  }
  doMove(res.col, false);
}
async function doHint() {
  if ($('btnHint').disabled) return;
  S.hints--; S.hintBusy = true; updateControls();
  const token = S.aiToken;
  const r = await ai.think({ board: Array.from(S.board), heights: Array.from(S.heights), moves: S.hist.length, me: S.myP, depth: 8, ms: 900 });
  S.hintBusy = false;
  if (token !== S.aiToken || S.over) return;
  S.hintCol = r.col; render(); updateControls();
  $('status').textContent = '💡 Try the dashed circle'; sfx.click();
}
function doUndo() {
  if ($('btnUndo').disabled) return;
  S.undos--; S.aiToken++;
  replay(S.hist.slice(0, -2)); S.hintCol = -1; S.winCells = [];
  render(); updateStatus(); updateControls(); sfx.click();
}

function onColumn(col) {
  if (!S.active || S.over || S.busy || turn() !== S.myP) return;
  if (S.heights[col] >= 6) { sfx.err(); return; }
  doMove(col, true);
}
function doMove(col, local) {
  const p = turn();
  const res = place(col); S.hintCol = -1; sfx.drop(); render();
  if (S.mode === 'online' && local) net.send({ t: 'move', col });
  if (res.state !== 'ok') return endMatch(res.state, p, res.cells);
  updateStatus(); updateControls();
  if (S.mode === 'ai' && turn() !== S.myP) aiTurn();
}

function settle(kind) {
  const info = { gain: 0, lines: [], extra: '' };
  if (S.mode === 'ai') {
    if (kind === 'win') {
      addCoins(WIN_COINS); info.gain = WIN_COINS;
      const idx = LEVELS.indexOf(S.level);
      save.wins[S.level.id] = (save.wins[S.level.id] || 0) + 1;
      persist();
      const next = LEVELS[idx + 1];
      if (next) {
        const w = save.wins[S.level.id], need = UNLOCK_NEED[idx + 1];
        if (w === need) info.extra = `🔓 ${next.name} unlocked!`;
        else if (w < need) info.extra = `${need - w} more win${need - w > 1 ? 's' : ''} on ${S.level.name} to unlock ${next.name}`;
      }
    }
  } else {
    if (kind === 'win' || kind === 'forfeit') {
      addCoins(WIN_COINS + POOL); info.gain = WIN_COINS + POOL;
      info.lines.push('100 for winning + 100 prize pool');
    } else if (kind === 'draw') {
      addCoins(STAKE);
      info.lines.push('Your 50 coin stake was refunded');
    } else {
      info.gain = -STAKE;
      info.lines.push('You lost your 50 coin stake');
    }
  }
  return info;
}
function endMatch(state, winner, cells) {
  S.over = true;
  S.active = state === 'forfeit' ? false : S.active;
  S.winCells = cells || []; S.hintCol = -1; S.busy = false; S.aiToken++;
  render(); updateStatus(); updateControls();
  const kind = state === 'draw' ? 'draw' : state === 'forfeit' ? 'forfeit' : (winner === S.myP ? 'win' : 'lose');
  const info = settle(kind);
  if (kind === 'win' || kind === 'forfeit') { sfx.win(); confetti(); }
  else if (kind === 'lose') sfx.lose();
  $('status').textContent = {
    win: 'You win! 🎉',
    lose: S.mode === 'ai' ? 'AI wins' : 'Friend wins',
    draw: "It's a draw",
    forfeit: 'Friend left - you win!'
  }[kind];
  setTimeout(() => showResult(kind, info), kind === 'draw' ? 500 : 1000);
}
function showResult(kind, info) {
  const T = {
    win: ['🎉', 'You win!'],
    lose: ['😅', S.mode === 'ai' ? 'AI wins' : 'Friend wins'],
    draw: ['🤝', "It's a draw"],
    forfeit: ['🏳️', 'Friend left']
  };
  $('mEmoji').textContent = T[kind][0];
  $('mTitle').textContent = T[kind][1];
  const g = $('mGain');
  g.textContent = info.gain ? (info.gain > 0 ? '+' : '') + info.gain + ' 🪙' : '';
  g.className = 'gain' + (info.gain < 0 ? ' neg' : '');
  $('mBody').textContent = info.lines.join(' · ') || (kind === 'lose' && S.mode === 'ai' ? 'Try again. You can use hints and undo.' : '');
  $('mExtra').textContent = info.extra || '';
  const B = $('mBtns'); B.innerHTML = '';
  const mk = (txt, cls, fn, id) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls; b.textContent = txt; b.onclick = fn;
    if (id) b.id = id;
    B.appendChild(b); return b;
  };
  if (S.mode === 'ai') {
    mk('Play again', 'gold', () => { sfx.click(); newAIMatch(); });
    mk('Levels', 'alt', () => { closeModal(); show('scrLevels'); });
  } else {
    const rb = mk('Rematch', 'gold', requestRematch, 'btnRematch');
    if (!net.conn) rb.disabled = true;
    mk('Leave', 'alt', () => { closeModal(); leaveOnline(); show('scrMenu'); });
  }
  $('modal').classList.remove('hidden');
  setTimeout(grantBonusIfNeeded, 600);
}
function closeModal() { $('modal').classList.add('hidden'); }

const net = {
  peer: null, conn: null, host: false, started: false, mine: false, theirs: false, timer: null,
  send(o) { try { if (this.conn && this.conn.open) this.conn.send(o); } catch (e) {} }
};
function loadPeerLib() {
  return new Promise((res, rej) => {
    if (window.Peer) return res();
    const s = document.createElement('script');
    s.src = PEER_SRC; s.onload = () => res(); s.onerror = () => rej(new Error('load'));
    document.head.appendChild(s);
  });
}
function leaveOnline() {
  clearTimeout(net.timer);
  try { net.send({ t: 'leave' }); } catch (e) {}
  const conn = net.conn, peer = net.peer;
  net.conn = null; net.peer = null; net.started = false; net.mine = net.theirs = false;
  setTimeout(() => {
    try { conn && conn.clo
